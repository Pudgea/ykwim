<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="style.css">
    <title>SmartNation</title>
</head>
<body>
    <div class="header" id="header-dblclick" title="Дважды нажмите для просмотра ответов">
        <img src="./assets/header.png" alt="">
    </div>
    <div class="main">
        <div class="m-header">
            <p>Главная</p>
            <p>></p>
            <p><b>Тестирование</b></p>
        </div>
        <div class="m-test">
            <div class="mt-side">
                <div class="mts-head" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                  <img src="https://avatars.mds.yandex.net/i?id=d089d2cb386947a18e97874f051befc79e0417fe-10649741-images-thumbs&n=13" alt="profile" style="width: 100px; height: 100px;   border: 2px solid #c4c4c4; border-radius: 5px; background-color: #bababb;">
                    <h1><b>ТЕСТ</b></h1>
                    <p>АКТИВЕН</p>
                </div>
                <div class="mts-main" style="overflow: hidden">
                    <p>ПРОГРАММИРОВАНИЕ ЦИФРОВЫХ УСТРОЙСТВ НА БАЗЕ МИКРОКОНТРОЛЛЕРОВ</p>
                </div>
                <div class="mts-main mts-main--hint" style="margin-top: 10px; padding: 10px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mts-main__icon" viewBox="0 0 16 16">
                        <circle cx="8" cy="8" r="6.25"/>
                        <path d="M8 7v4M8 5.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5z"/>
                    </svg>
                    <p>Ответив на все вопросы обязательно нажмите кнопку Завершить</p>
                </div>
            </div>
            <div class="mt-main">
                <div class="btn-shittt">
                    <h3>></h3>
                </div>
                <div class="mtm-head">
                    <div class="time">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#8DBE2D" class="bi bi-clock" viewBox="0 0 16 16">
                        <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/>
                        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/>
                      </svg>
                      <p>00:00:00</p>
                    </div>
                    <div class="name">
                        <p id="user-name-display"></p>
                    </div>
                </div>
                <div class="mtm-block">
                    <p>Вопрос: </p>
                    <p id="question-text">Загрузка...</p>
                </div>
                <div class="mtm-block">
                    <p>Варианты: </p>
                    <div class="answers" id="answers-container"></div>
                </div>
                <div class="buttons">
                    <div class="button">
                        <h1 class="sec"><</h1>
                        <div class="btn">
                            Предыдущий вопрос
                        </div>
                    </div>
                    <h1 id="question-counter">1 / 40</h1>
                    <div class="button">
                        <div class="btn">
                            Следующий вопрос
                        </div>
                        <h1 class="sec">></h1>
                    </div>
                </div>
            </div>
            <div class="mt-q">
                <div class="container" id="sidebar-questions"></div>
                <div class="sidebar-pagination">
                    <button type="button" class="sidebar-arrow sidebar-arrow--prev" id="sidebar-prev" aria-label="Предыдущие 20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
                    </button>
                    <button type="button" class="sidebar-arrow sidebar-arrow--next" id="sidebar-next" aria-label="Следующие 20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <img src="./assets/footer.png" alt="">
    </div>

    <div class="modal-overlay modal-overlay-name" id="name-modal-overlay" aria-hidden="true">
        <div class="modal modal-name" id="name-modal" role="dialog">
            <div class="modal-header">
                <h2>Выберите имя</h2>
            </div>
            <div class="modal-body">
                <select id="name-select" class="name-select">
                    <option value="">— Выберите —</option>
                    <option value="Рожков Артем Евгеньевич">Рожков Артем Евгеньевич</option>
                    <option value="Заккиев Ерсултан Бауыржанұлы">Заккиев Ерсултан Бауыржанұлы</option>
                </select>
                <button type="button" class="name-confirm btn" id="name-confirm">Подтвердить</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
        <div class="modal" id="modal" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Вопросы и ответы</h2>
                <button type="button" class="modal-close" id="modal-close" aria-label="Закрыть">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>
</body>
<script>
    // Set the timer duration in seconds (40 minutes)
    const timerDuration = 40 * 60;
    let timeRemaining = timerDuration;
  
    // Function to format time as HH:MM:SS
    function formatTime(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }
  
    // Update the timer display every second
    const timerElement = document.querySelector('.time p');
    function updateTimer() {
      if (timeRemaining >= 0) {
        timerElement.textContent = formatTime(timeRemaining);
        timeRemaining--;
      } else {
        clearInterval(timerInterval);
        // Timer finished - you can add any action here
      }
    }
  
    const timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
  </script>

  <script>
    (function() {
      const STORAGE_KEY = 'ykwim_user_name';
      const nameDisplay = document.getElementById('user-name-display');
      const nameOverlay = document.getElementById('name-modal-overlay');
      const nameSelect = document.getElementById('name-select');
      const nameConfirm = document.getElementById('name-confirm');

      function applySavedName() {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          if (nameDisplay) nameDisplay.textContent = saved;
          if (nameOverlay) {
            nameOverlay.setAttribute('aria-hidden', 'true');
            nameOverlay.classList.remove('modal-open');
          }
          return true;
        }
        return false;
      }

      function showNameModal() {
        if (nameOverlay) {
          nameOverlay.setAttribute('aria-hidden', 'false');
          nameOverlay.classList.add('modal-open');
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        if (!applySavedName()) showNameModal();

        if (nameConfirm && nameSelect) {
          nameConfirm.addEventListener('click', function() {
            var value = nameSelect.value.trim();
            if (!value) return;
            localStorage.setItem(STORAGE_KEY, value);
            if (nameDisplay) nameDisplay.textContent = value;
            if (nameOverlay) {
              nameOverlay.setAttribute('aria-hidden', 'true');
              nameOverlay.classList.remove('modal-open');
            }
          });
        }
      });
    })();
  </script>
  
  <script>
    (function() {
      const QUESTIONS_LIMIT = 40;
      const LETTERS = ['A', 'B', 'C', 'D', 'E'];

      function parseCSV(text) {
        const rows = [];
        const lines = text.split(/\r?\n/).filter(line => line.trim());
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const row = [];
          let cell = '';
          let inQuotes = false;
          for (let j = 0; j < line.length; j++) {
            const c = line[j];
            if (c === '"') {
              inQuotes = !inQuotes;
            } else if ((c === ',' || c === '\n') && !inQuotes) {
              if (c === ',') {
                row.push(cell.trim().replace(/^"|"$/g, ''));
                cell = '';
              }
            } else {
              cell += c;
            }
          }
          row.push(cell.trim().replace(/^"|"$/g, ''));
          rows.push(row);
        }
        return rows;
      }

      function parseQuestions(csvRows, limit) {
        if (csvRows.length < 2) return [];
        const questions = [];
        const max = limit === undefined ? csvRows.length : Math.min(csvRows.length, 1 + (limit || 0));
        for (let i = 1; i < max; i++) {
          const row = csvRows[i];
          if (row.length >= 8) {
            questions.push({
              id: row[0],
              question: row[1],
              options: { A: row[2], B: row[3], C: row[4], D: row[5], E: row[6] },
              correct: (row[7] || '').trim().toUpperCase().charAt(0)
            });
          }
        }
        return questions;
      }

      const SIDEBAR_PAGE_SIZE = 20;
      let questionsData = [];
      let allQuestionsForModal = [];
      let userAnswers = {};
      let currentIndex = 0;
      let sidebarPage = 0;

      function getSidebarPageCount() {
        return Math.ceil(questionsData.length / SIDEBAR_PAGE_SIZE) || 1;
      }

      function renderSidebar() {
        const container = document.getElementById('sidebar-questions');
        if (!container) return;
        const start = sidebarPage * SIDEBAR_PAGE_SIZE;
        const end = Math.min(start + SIDEBAR_PAGE_SIZE, questionsData.length);
        container.innerHTML = '';
        for (let i = start; i < end; i++) {
          const div = document.createElement('div');
          div.className = 'mtq-q' + (i === currentIndex ? ' active' : '');
          div.dataset.index = i;
          div.innerHTML = '<p>' + (i + 1) + '.</p><p>A</p><p>B</p><p>C</p><p>D</p><p>E</p>';
          container.appendChild(div);
        }
        const prevBtn = document.getElementById('sidebar-prev');
        const nextBtn = document.getElementById('sidebar-next');
        if (prevBtn) prevBtn.disabled = sidebarPage <= 0;
        if (nextBtn) nextBtn.disabled = sidebarPage >= getSidebarPageCount() - 1;
      }

      function updateSidebarSelection() {
        document.querySelectorAll('.mtq-q').forEach((el) => {
          const i = parseInt(el.dataset.index, 10);
          const letter = userAnswers[i] || '';
          el.setAttribute('data-selected', letter);
          el.classList.toggle('active', i === currentIndex);
          const ps = el.querySelectorAll('p');
          if (ps.length >= 6) {
            for (let k = 1; k <= 5; k++) {
              ps[k].className = letter === LETTERS[k - 1] ? 'selected' : '';
              ps[k].setAttribute('data-selected', letter === LETTERS[k - 1] ? 'true' : '');
            }
          }
        });
      }

      function renderQuestion(index) {
        const q = questionsData[index];
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const counter = document.getElementById('question-counter');
        if (!q) {
          if (questionText) questionText.textContent = 'Нет данных';
          return;
        }
        if (questionText) questionText.textContent = q.question;
        if (counter) counter.textContent = (index + 1) + ' / ' + questionsData.length;
        if (answersContainer) {
          answersContainer.innerHTML = '';
          LETTERS.forEach(letter => {
            const opt = q.options[letter];
            if (!opt) return;
            const answ = document.createElement('div');
            answ.className = 'answ' + (userAnswers[index] === letter ? ' selected' : '');
            answ.dataset.letter = letter;
            answ.dataset.index = index;
            answ.innerHTML = '<div class="letter">' + letter + '</div><p>' + opt + '</p>';
            answersContainer.appendChild(answ);
          });
        }
        const newPage = Math.floor(index / SIDEBAR_PAGE_SIZE);
        if (newPage !== sidebarPage) {
          sidebarPage = newPage;
          renderSidebar();
        } else {
          document.querySelectorAll('.mtq-q').forEach((el) => {
            el.classList.toggle('active', parseInt(el.dataset.index, 10) === index);
          });
          updateSidebarSelection();
        }
      }

      function openModal() {
        const overlay = document.getElementById('modal-overlay');
        const body = document.getElementById('modal-body');
        if (!overlay || !body) return;
        body.innerHTML = '';
        (allQuestionsForModal.length ? allQuestionsForModal : questionsData).forEach((q, i) => {
          const correctLetter = q.correct;
          const correctText = q.options[correctLetter] || correctLetter;
          const block = document.createElement('div');
          block.className = 'modal-qa-block';
          block.innerHTML = '<strong>' + (i + 1) + '. ' + q.question + '</strong><br><span class="modal-answer">Ответ: ' + correctLetter + '. ' + correctText + '</span>';
          body.appendChild(block);
        });
        overlay.setAttribute('aria-hidden', 'false');
        overlay.classList.add('modal-open');
      }

      function closeModal() {
        const overlay = document.getElementById('modal-overlay');
        if (!overlay) return;
        overlay.setAttribute('aria-hidden', 'true');
        overlay.classList.remove('modal-open');
      }

      document.addEventListener('DOMContentLoaded', () => {
        fetch('./assets/pm05_questions.csv')
          .then(r => r.text())
          .then(text => {
            const rows = parseCSV(text);
            questionsData = parseQuestions(rows, QUESTIONS_LIMIT);
            allQuestionsForModal = parseQuestions(rows);
            renderSidebar();
            renderQuestion(0);
            document.getElementById('header-dblclick').addEventListener('dblclick', openModal);
            document.getElementById('modal-close').addEventListener('click', closeModal);
            document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
          })
          .catch(() => {
            const questionText = document.getElementById('question-text');
            if (questionText) questionText.textContent = 'Ошибка загрузки вопросов';
          });

        document.addEventListener('click', (e) => {
          const answ = e.target.closest('.answ');
          if (answ) {
            const index = parseInt(answ.dataset.index, 10);
            const letter = answ.dataset.letter;
            userAnswers[index] = letter;
            renderQuestion(currentIndex);
          }
          const sidebarItem = e.target.closest('.mtq-q');
          if (sidebarItem && sidebarItem.dataset.index !== undefined) {
            currentIndex = parseInt(sidebarItem.dataset.index, 10);
            renderQuestion(currentIndex);
          }
        });

        const nextBtn = document.querySelector('.buttons .button:last-child .btn');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            if (currentIndex < questionsData.length - 1) {
              currentIndex++;
              renderQuestion(currentIndex);
            }
          });
        }
        const prevBtn = document.querySelector('.buttons .button:first-child .btn');
        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
              currentIndex--;
              renderQuestion(currentIndex);
            }
          });
        }

        document.getElementById('sidebar-prev')?.addEventListener('click', () => {
          if (sidebarPage > 0) {
            sidebarPage--;
            renderSidebar();
            updateSidebarSelection();
          }
        });
        document.getElementById('sidebar-next')?.addEventListener('click', () => {
          if (sidebarPage < getSidebarPageCount() - 1) {
            sidebarPage++;
            renderSidebar();
            updateSidebarSelection();
          }
        });
      });
    })();
  </script>
</html>
